# ═══════════════════════════════════════════════════════════════════════════════
# SignFlow CMS — CUSTOMER deployment (pre-built images)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   docker login ${SIGNFLOW_REGISTRY}
#   docker compose pull && docker compose up -d
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python scripts/bootstrap.py   # first install only
#
# DELIBERATE DIFFERENCES from the development stack:
#   - `image:` instead of `build:` — nothing is compiled on the customer machine
#   - NO source code mounted (the code lives inside the image and is no longer
#     hot-reloadable: an upgrade is `pull` + `up -d`, never a `git pull`)
#   - no `--reload` (development mode, costly and unstable in production)
#   - mailpit removed (test SMTP) — configure a real SMTP server in .env
#   - API and UI ports bound to 127.0.0.1: nginx/Caddy exposes them to the network
#
# ⚠️ MinIO is the ONLY service published on all interfaces: browsers and players
# download media through signed URLs and must reach it directly. So
# MINIO_PUBLIC_ENDPOINT must carry an address THEY can reach — never "localhost",
# or every machine would end up querying itself.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Environment shared by the five application services (backend + 4 workers).
# A single source of truth: a variable forgotten on one worker is a silent bug —
# outgoing mail once failed on the worker side for exactly that reason, because
# SMTP_* had only been declared on the backend.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}@postgres:5432/${POSTGRES_DB:-signflow}
  # RLS: the API must connect as signflow_app (non-owner, subject to row-level
  # security), NEVER as the superuser above. This line was MISSING until 2026-07-30:
  # the backend silently fell back to the superuser URL (the in-code fallback only
  # rewrites the dev-style "signflow:signflow@" credentials), which disabled every
  # row-level-security policy on client installs. The role and its password have
  # always been provisioned by postgres-init.sh — only this line was absent.
  DATABASE_APP_URL: postgresql+asyncpg://signflow_app:${POSTGRES_APP_PASSWORD:-signflow_app_secret}@postgres:5432/${POSTGRES_DB:-signflow}
  DATABASE_WORKER_URL: postgresql+asyncpg://signflow_worker:${POSTGRES_WORKER_PASSWORD:-signflow_worker_secret}@postgres:5432/${POSTGRES_DB:-signflow}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is missing}
  MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is missing}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is missing}
  MINIO_USE_SSL: "false"
  CMS_JWT_SECRET: ${CMS_JWT_SECRET:?CMS_JWT_SECRET is missing}
  # Vault for per-organisation AI keys — Fernet key: `openssl rand -base64 32`
  # (a `rand -hex` value is REJECTED).
  CMS_VAULT_KEY: ${CMS_VAULT_KEY:?CMS_VAULT_KEY is missing}
  SIGNFLOW_TZ: ${SIGNFLOW_TZ:-Europe/Paris}
  # Pinned release tag, surfaced in the UI (sidebar footer) so an operator can
  # read at a glance which version this server runs. Same value that pins the
  # image tags above.
  SIGNFLOW_VERSION: ${SIGNFLOW_VERSION:-dev}
  # "Update available" bell: the backend polls this public manifest and compares it
  # to SIGNFLOW_VERSION. Leave BELL=true on a self-hosted install so the operator is
  # notified; a source build ("dev") stays silent regardless.
  SIGNFLOW_UPDATE_MANIFEST_URL: ${SIGNFLOW_UPDATE_MANIFEST_URL:-https://raw.githubusercontent.com/edkahall/signflow-install/main/versions.json}
  SIGNFLOW_UPDATE_BELL: ${SIGNFLOW_UPDATE_BELL:-true}
  # Product licence: a JSON document signed by the publisher, verified LOCALLY
  # (never a phone-home — some sites run on closed networks). Only the PUBLIC key
  # is deployed here; the private key never leaves the publisher.
  # ⚠️ The path MUST live on the mounted `./config` directory, not inside the
  # container: this stack runs from the image with no source mount, so a licence
  # written anywhere else would be silently lost on the next `up -d` — and the
  # server would quietly fall back to "unlicensed".
  SIGNFLOW_LICENCE_PATH: ${SIGNFLOW_LICENCE_PATH:-/etc/signflow/licence.json}
  SIGNFLOW_LICENCE_PUBLIC_KEY: ${SIGNFLOW_LICENCE_PUBLIC_KEY:-}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-'[]'}
  # Player machine tokens: rotated on reconnect, so screens never go dark
  CMS_PLAYER_TOKEN_EXPIRE_DAYS: ${CMS_PLAYER_TOKEN_EXPIRE_DAYS:-60}
  CMS_PLAYER_TOKEN_REFRESH_DAYS: ${CMS_PLAYER_TOKEN_REFRESH_DAYS:-20}
  CMS_PLAYER_TOKEN_GRACE_DAYS: ${CMS_PLAYER_TOKEN_GRACE_DAYS:-14}
  EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-redis_streams}
  # Kahall ERP integration — OPTIONAL: empty means SignFlow runs standalone
  ERP_API_URL: ${ERP_API_URL:-}
  ERP_SSO_ENABLED: ${ERP_SSO_ENABLED:-false}
  # AI: internal LiteLLM proxy (RAG embeddings computed locally by Ollama)
  CMS_LITELLM_URL: ${CMS_LITELLM_URL:-http://litellm:4000}
  CMS_LITELLM_API_KEY: ${CMS_LITELLM_API_KEY:-}
  CMS_EMBED_MODEL: ${CMS_EMBED_MODEL:-local/nomic-embed}
  CMS_ASSISTANT_MODEL: ${CMS_ASSISTANT_MODEL:-claude-sonnet-4-6}
  CMS_FEED_SUMMARY_MODEL: ${CMS_FEED_SUMMARY_MODEL:-claude-haiku-4-5}
  FEED_PROXY_URL: ${FEED_PROXY_URL:-http://feed-proxy:8001}
  # Interactive API documentation — false in production (security hardening)
  CMS_DOCS_ENABLED: ${CMS_DOCS_ENABLED:-false}
  # SMTP — scheduled reports and the email alert channel. Must be declared on the
  # backend AND the workers: alert dispatch runs on the worker side.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
  SMTP_TLS: ${SMTP_TLS:-true}
  # Proof of play — archiving and rotation
  CMS_POP_HOT_RETENTION_DAYS: ${CMS_POP_HOT_RETENTION_DAYS:-90}
  CMS_POP_ARCHIVE_PREFIX: ${CMS_POP_ARCHIVE_PREFIX:-pop-archives}
  # "Jeanine" — messaging agent. Empty = channel disabled.
  CMS_TELEGRAM_BOT_TOKEN: ${CMS_TELEGRAM_BOT_TOKEN:-}
  CMS_TELEGRAM_WEBHOOK_SECRET: ${CMS_TELEGRAM_WEBHOOK_SECRET:-}

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      POSTGRES_DB: ${POSTGRES_DB:-signflow}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-signflow_app_secret}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-signflow_worker_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the extensions (pgvector) and the signflow_app / signflow_worker
      # roles. Runs ONLY against an empty data directory (first installation).
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object storage ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is missing}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is missing}
    volumes:
      - minio_data:/data
    ports:
      # The only service open to the network: browsers and players download media
      # through signed URLs and must reach it directly.
      - "${MINIO_BIND:-0.0.0.0}:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-backend:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment: *app-env
    volumes:
      # Product licence: a PERSISTENT host directory. Mount the DIRECTORY, never the
      # file itself -- Docker silently creates a directory in place of a missing
      # bind-mounted file, which would make the licence unreadable with no clear error.
      - ./config:/etc/signflow
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Light worker (events, notifications, analytics) ─────────────────────────
  # Kept separate from media work so real-time tasks are never stuck behind a
  # long video transcode.
  celery-worker:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-worker:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *app-env
      LIGHT_CONCURRENCY: ${LIGHT_CONCURRENCY:-}
    depends_on:
      - backend
    command: >
      sh -c 'celery -A app.workers.celery_app worker --loglevel=info
      --queues=default,notifications,analytics
      --concurrency=$$(python -c "from app.core.resources import light_concurrency; print(light_concurrency())")'

  # ── Media worker (ffmpeg transcoding, document conversion) ──────────────────
  # Concurrency adapts itself to the machine's real CPU and memory.
  celery-media:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-media:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *app-env
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-}
    depends_on:
      - backend
    command: >
      sh -c 'celery -A app.workers.celery_app worker --loglevel=info
      --queues=media
      --concurrency=$$(python -c "from app.core.resources import media_concurrency; print(media_concurrency())")'

  # ── Screenshot worker (Playwright/Chromium — URL Display capture) ───────────
  celery-screenshot:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-screenshot:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment: *app-env
    volumes:
      # Product licence: a PERSISTENT host directory. Mount the DIRECTORY, never the
      # file itself -- Docker silently creates a directory in place of a missing
      # bind-mounted file, which would make the licence unreadable with no clear error.
      - ./config:/etc/signflow
    depends_on:
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=cms_screenshot --concurrency=2

  # ── Scheduler ───────────────────────────────────────────────────────────────
  # Uses the slim backend image: it schedules tasks and needs neither ffmpeg nor
  # LibreOffice.
  celery-beat:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-backend:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment: *app-env
    volumes:
      # Product licence: a PERSISTENT host directory. Mount the DIRECTORY, never the
      # file itself -- Docker silently creates a directory in place of a missing
      # bind-mounted file, which would make the licence unreadable with no clear error.
      - ./config:/etc/signflow
    depends_on:
      - backend
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler

  # ── Web interface ───────────────────────────────────────────────────────────
  # Standalone `runner` image: the build is already done, nothing is compiled at
  # startup (~90 ms to boot). ⚠️ NEXT_PUBLIC_API_URL is inlined AT BUILD TIME, so
  # setting it here would have NO effect: the published image uses a RELATIVE API
  # URL, meaning the browser calls whichever host served the page.
  frontend:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-frontend:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - backend

  # ── Feed relay (RSS, social networks, weather) ──────────────────────────────
  feed-proxy:
    image: ${SIGNFLOW_REGISTRY:-registry.dernoult.net:8443}/signflow-feed-proxy:${SIGNFLOW_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # ── Local embeddings (AI assistant) ─────────────────────────────────────────
  # Serves nomic-embed-text (768 dimensions) only: embeddings stay entirely local,
  # with no API key and no GPU. The model (~0.3 GB) is downloaded on first start
  # and kept in the volume. Remove this service and litellm if you do not use the
  # AI assistant.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && ollama pull nomic-embed-text && wait"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── LLM proxy ───────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    logging: *default-logging
    command: --config /app/config.yaml --port 4000
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      - ollama
    healthcheck:
      # The litellm image ships no curl, so probe with python instead.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  # Media are the only dataset that grows without bound (a signage library
  # reaches hundreds of gigabytes). A bare named volume would write them under
  # /var/lib/docker — on the SYSTEM disk, usually the smallest in the machine.
  #
  # This bind mount makes the location explicit and movable: MEDIA_DATA_PATH is
  # asked for at install time and can point at a large disk.
  # ⚠️ The directory must EXIST before the first start: Docker does not create it
  # for an `o: bind` volume and fails with an unhelpful error.
  # ⚠️ Avoid NFS/CIFS: MinIO relies on POSIX semantics that file shares do not
  # guarantee. A NAS is fine as a BLOCK device (iSCSI), not as a file share.
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_DATA_PATH:-/var/lib/signflow/media}
  ollama_data:
